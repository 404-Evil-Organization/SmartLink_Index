server:
  port: 8080
  servlet:
    context-path: /api
  shutdown: graceful

spring:
  application:
    name: zhilian-backend

  profiles:
    active: dev

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB
      file-size-threshold: 2KB

  lifecycle:
    timeout-per-shutdown-phase: 30s

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zhilian.zhilianbackend
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: now()
      logic-not-delete-value: "'1970-01-01 00:00:00'"
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: false

# Swagger
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.zhilian.zhilianbackend.controller
  paths-to-match: /**

# JWT
jwt:
  secret: ZhilianSecretKey2024WithMoreThan32BytesLengthSecure!
  expiration: 86400000
  header: Authorization
  token-prefix: Bearer

# OSS
oss:
  endpoint: oss-cn-guangzhou.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: smartlink-index
  domain: https://smartlink-index.oss-cn-guangzhou.aliyuncs.com

# 日志
logging:
  level:
    root: info
    com.zhilian: debug
    com.zhilian.zhilianbackend.mapper: debug
  file:
    name: logs/zhilian-backend.log

# 自定义
app:
  jwt-mode: 1